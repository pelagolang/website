<pre class="pelago"><code><span class="t-doc">//~ Sum the squares of 1 to n.</span>
<span class="t-decl">fn</span> <span class="t-fn">sum_squares</span>(n: <span class="t-type">int</span>) <span class="t-op">-&gt;</span> <span class="t-type">int</span> {
    <span class="t-binding">var</span> total <span class="t-op">=</span> <span class="t-num">0</span>
    <span class="t-control">for</span> i <span class="t-control">of</span> <span class="t-num">1</span><span class="t-op">..=</span>n {
        total <span class="t-op">+=</span> i <span class="t-op">*</span> i
    }
    <span class="t-control">return</span> total
}

<span class="t-decl">fn</span> <span class="t-fn">main</span>() {
    <span class="t-binding">const</span> n <span class="t-op">=</span> <span class="t-num">10</span>
    <span class="t-fn">print</span>(<span class="t-str">&quot;sum of squares up to </span><span class="t-interp">#n</span><span class="t-str">: </span><span class="t-interp">#(</span><span class="t-fn">sum_squares</span>(n)<span class="t-interp">)</span><span class="t-str">&quot;</span>)
}
</code></pre>
